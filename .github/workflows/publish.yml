name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to Docker Hub"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  publish:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    env:
      DO_PUSH: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.push_images == 'true' }}
      IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_HUB_USERNAME || 'syncdocdev' }}
    
    strategy:
      matrix:
        include:
          - context: .
            image_suffix: syncdoc-api
            dockerfile: backend/Dockerfile.prod
          - context: .
            image_suffix: syncdoc-frontend
            dockerfile: frontend/Dockerfile.prod

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.IMAGE_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        if: env.DO_PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build only
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push_images == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: docker.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_suffix }}:dry-run

  update-dockerhub-overview:
    name: Update Docker Hub Overview
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.push_images == 'true'
    env:
      IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_HUB_USERNAME || 'syncdocdev' }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_HUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Sync README to Docker Hub overviews
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DOCKERHUB_PASSWORD}" ]; then
            echo "DOCKERHUB_TOKEN or DOCKER_HUB_TOKEN is required to update Docker Hub overview"
            exit 1
          fi

          DESCRIPTION="Infrastructure-as-code living documentation for Terraform, Docker, and Ansible"
          BODY=$(jq -Rs --arg description "$DESCRIPTION" \
            '{description: $description, full_description: .}' README.md)
          printf '%s' "${BODY}" > /tmp/dockerhub-overview.json

          TOKEN=$(jq -n \
            --arg username "${IMAGE_NAMESPACE}" \
            --arg password "${DOCKERHUB_PASSWORD}" \
            '{username: $username, password: $password}' \
            | curl -fsSL \
                -H "Content-Type: application/json" \
                -d @- \
                https://hub.docker.com/v2/users/login/ \
            | jq -r '.token // .access_token // empty')

          if [ -z "${TOKEN}" ]; then
            echo "Docker Hub login did not return an API token"
            exit 1
          fi

          patch_repository() {
            local endpoint="$1"
            local auth_header="$2"
            local status

            status=$(curl -sS \
              -o /tmp/dockerhub-response.json \
              -w "%{http_code}" \
              -X PATCH "${endpoint}" \
              -H "${auth_header}" \
              -H "Content-Type: application/json" \
              -d @/tmp/dockerhub-overview.json)

            [[ "${status}" =~ ^2 ]]
          }

          for repo in syncdoc-api syncdoc-frontend; do
            echo "Updating Docker Hub overview for ${IMAGE_NAMESPACE}/${repo}"
            if patch_repository \
              "https://hub.docker.com/v2/namespaces/${IMAGE_NAMESPACE}/repositories/${repo}" \
              "Authorization: Bearer ${TOKEN}"; then
              continue
            fi

            if patch_repository \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAMESPACE}/${repo}/" \
              "Authorization: JWT ${TOKEN}"; then
              continue
            fi

            echo "Failed to update Docker Hub overview for ${IMAGE_NAMESPACE}/${repo}"
            cat /tmp/dockerhub-response.json
            exit 1
          done
