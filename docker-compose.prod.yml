version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-syncdoc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncdoc} -d ${POSTGRES_DB:-syncdoc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      platforms:
        - linux/amd64
        - linux/arm64
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-syncdoc}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-syncdoc}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      ENVIRONMENT: production
      PYTHONUNBUFFERED: "1"
      # Add other production environment variables here from .env or ENV_VARS.md
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      platforms:
        - linux/amd64
        - linux/arm64
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-syncdoc}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-syncdoc}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      ENVIRONMENT: production
      PYTHONUNBUFFERED: "1"
      # Add other production environment variables here from .env or ENV_VARS.md
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://your-domain.com}  # Set to your actual domain
    ports:
      - "80:80"  # Standard HTTP port
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: