services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncdoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncdoc_dev}
      POSTGRES_DB: syncdoc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncdoc -d syncdoc"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${SYNC_DOC_API_IMAGE:-syncdocdev/syncdoc-api:latest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://syncdoc:${POSTGRES_PASSWORD:-syncdoc_dev}@postgres:5432/syncdoc
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      FRONTEND_URL: ${PROD_FRONTEND_URL:-http://localhost:5174}
      BACKEND_URL: ${PROD_BACKEND_URL:-http://localhost:8001}
      ALLOW_SELF_REGISTER: ${ALLOW_SELF_REGISTER:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-https://api.openai.com/v1}
      GH_CLIENT_ID: ${GH_CLIENT_ID:-}
      GH_CLIENT_SECRET: ${GH_CLIENT_SECRET:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@syncdoc.dev}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-SyncDoc}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      REGISTRATION_NOTIFY_TO: ${REGISTRATION_NOTIFY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-60}
    command: gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 120
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\" || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  worker:
    image: ${SYNC_DOC_API_IMAGE:-syncdocdev/syncdoc-api:latest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://syncdoc:${POSTGRES_PASSWORD:-syncdoc_dev}@postgres:5432/syncdoc
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-https://api.openai.com/v1}
    command: celery -A app.celery_app worker --loglevel=info --concurrency 4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  beat:
    image: ${SYNC_DOC_API_IMAGE:-syncdocdev/syncdoc-api:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENVIRONMENT: production
      PYTHONUNBUFFERED: "1"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-https://api.openai.com/v1}
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ${SYNC_DOC_FRONTEND_IMAGE:-syncdocdev/syncdoc-frontend:latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${APP_PORT:-5174}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
